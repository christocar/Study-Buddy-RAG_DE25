[project]
name = "study-buddy"
version = "0.1.0"
description = "Group project for AIOps class examination"
readme = "README.md"
authors = [
    { name = "Aira Franco", email = "adelosofranco@gmail.com" },
    { name = "Christoffer Carlsson", email = "christoffer.carlsson88@gmail.com" },
    { name = "Johnny Hyytiäinen", email = "Johnny.Hyytiainen@gmail.com" },
    { name = "Putu Indira Mahadiva Arysaputri", email = "indiramahadiva1@gmail.com" },
]

requires-python = "==3.13.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

[dependency-groups]
backend = [
    "fastapi[standard]>=0.165.0",
    "lancedb>=0.41.0",
    "openai>=3.57.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai-slim[anthropic,evals,logfire,openai]>=2.71.0",
    "pypdf>=7.1.1",
]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
frontend = [
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]
